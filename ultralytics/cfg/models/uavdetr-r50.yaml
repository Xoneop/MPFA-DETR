# Parameters
nc: 10  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-cls.yaml' will call yolov8-cls.yaml with scale 'n'
  # [depth：用来扩大模块个数, width:用来扩大缩小通道数, max_channels]
  l: [1.00, 1.00, 1024]
backbone:
  # [from, repeats, module, args(卷积核大小、通道数、激活函数)]
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']] # 0-P1/2   32
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']] # 1        32
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']] # 2        64
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2/4                          64
  
  # [ch_out, block_type, block_nums, stage_num, act, variant]
  - [-1, 1, Blocks, [64, BottleNeck, 3, 2, 'relu']] # 4               256 s2
  - [-1, 1, Blocks, [128, BottleNeck, 4, 3, 'relu']] # 5-P3/8         512 s3
  - [-1, 1, Blocks, [256, BottleNeck, 6, 4, 'relu']] # 6-P4/16        1024 s4
  - [-1, 1, Blocks, [512, BottleNeck, 3, 5, 'relu']] # 7-P5/32        2048 S5


head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 8 input_proj.2  256
  - [-1, 1, AIFI, [1024, 8]] # 9                                     256 s5->AIFI
  - [-1, 1, Conv, [256, 1, 1]]  # 10, Y5, lateral_convs.0            256 s5->AIFI->conv

  - [-1, 1, DySample,  [2]] # 11                               256 s5->AIFI->conv->DySample [-1, 1, DySample,  [2, 'lp']] # 11
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 12 input_proj.1  256 s4->conv
  - [[-2, -1], 1, Concat, [1]] # 13                                  512 s5->AIFI->conv->DySample + s4->conv
  - [-1, 3, RepC3, [256]]  # 14, fpn_blocks.0                        256 [s5->AIFI->conv->DySample + s4->conv]->RepC3(3)[Fusion]
  - [-1, 1, Conv, [128, 1, 1]]   # 15, Y4, lateral_convs.1           128 [s5->AIFI->conv->DySample + s4->conv]->RepC3(3)[Fusion]->conv


  - [-1, 1, DySample,  [2]] # 16                               128 [s5->AIFI->conv->DySample + s4->conv]->RepC3(3)[Fusion]->conv->DySample
  - [4, 1, Focus, [128,1]] # 17                                      128 s2->Focus(聚焦通道信息)
  - [[-1, -2, 5], 1, Concat, [1]] # 18                               768 [s2->Focus(聚焦通道信息) + [s5->AIFI->conv->DySample + s4->conv]->RepC3(3)[Fusion]->conv->DySample + s3]
  - [-1, 1, MFFF, []] # 19                                           768 [s2->Focus(聚焦通道信息) + [s5->AIFI->conv->DySample + s4->conv]->RepC3(3)[Fusion]->conv->DySample + s3] -> MFFF
  - [-1, 3, RepC3, [256]] # 20                                       256

  - [-1, 1, FrequencyFocusedDownSampling, [256]]   # 21              256
  - [[-1, 15], 1, Concat, [1]] # 22                                  384
  - [-1, 3, RepC3, [256]] # 23                                       256
  
  - [-1, 1, FrequencyFocusedDownSampling, [256]]   # 24              256
  - [[-1, 10], 1, Concat, [1]] # 25                                  512
  - [-1, 3, RepC3, [256]] # 26                                       256
  
  - [[20, -1], 1, SemanticAlignmenCalibration, []] # 27              256

  - [[27, 23, 26], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 6]]  # RTDETRDecoder(P3, P4, P5)   256
